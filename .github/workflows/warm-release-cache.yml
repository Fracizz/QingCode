name: Warm release cache

# Release 只在 tag 上运行，而 tag 作用域写入的缓存其他 tag 读不到，每次发布都从零编译。
# 这里在默认分支上用与 Release 相同的构建命令预热 Rust 缓存（shared-key 一致），
# tag 上的 Release 可读取默认分支的缓存。每周定时运行一次，避免缓存 7 天未访问被回收。
on:
  push:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - 'scripts/package-*.ps1'
      - 'scripts/package-macos.sh'
      - '.github/workflows/warm-release-cache.yml'
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache-${{ github.ref }}
  cancel-in-progress: true

# 发布产物按体积优化编译（Tauri 官方建议的组合）：本地 [profile.release] 为构建速度保留
# opt-level 2 / 无 LTO / 增量；CI 用环境变量覆盖。实测 Windows x64 exe 约 25.0 MB → 16.3 MB。
# swatinem/rust-cache 把 CARGO_* 环境变量计入缓存 key：release.yml 与 warm-release-cache.yml
# 必须保持完全一致，否则 tag 构建读不到预热缓存。
env:
  CARGO_PROFILE_RELEASE_OPT_LEVEL: s
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-windows-x64
      - run: pnpm install --frozen-lockfile
      - name: Build portable exe (x64)
        shell: pwsh
        run: ./scripts/package-exe.ps1 -Force

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-windows-arm64
      - run: pnpm install --frozen-lockfile
      - name: Build portable exe (arm64)
        shell: pwsh
        run: ./scripts/package-exe.ps1 -Force -Target aarch64-pc-windows-msvc

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-macos-arm64
      - run: pnpm install --frozen-lockfile
      - name: Build macOS arm64
        run: |
          chmod +x ./scripts/package-macos.sh
          ./scripts/package-macos.sh --force
