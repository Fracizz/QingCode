<!-- QingCode Next 应用图标母版（扁平版）：近黑圆角底块 + 青色圆环 + 白色光标条。
     光标条压在圆环右下角充当 Q 的尾巴，同时表达命令行光标；圆环在光标条外 20 单位处直接裁出缺口，
     不靠底色遮挡，Android 单色主题图标可原样复用。全部纯色，无渐变、无高光。
     几何：圆环圆心 (245,247)，外半径 145、内半径 90（环宽 55）；缺口为 x≥256 且 y≥309 的矩形；光标条 x276 y329 150×52。
     图形宽约占底块 64%。按面积质心而非外框居中：质心落在 (256,253)，水平居中、略高于几何中心（视觉中心），
     因此光标条一侧右边距 86 小于左边距 100，下边距 120 大于上边距 102。改几何后需重新核算质心。
     颜色：底块 #0E0F11 比标题栏 #141414 略深，应用内仍能看出底块；青色 #4ECDB5 即主题 token --color-qn-brand。
     改动后运行 pnpm icons 重新生成各平台图标，并同步 Logo.tsx、index.html 进场页和 Android 自适应图标。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#0E0F11"/>
  <path fill="#4ECDB5" d="M256 391.58A145 145 0 1 1 376.08 309H310.24A90 90 0 1 0 256 336.33Z"/>
  <rect x="276" y="329" width="150" height="52" rx="11" fill="#FFFFFF"/>
</svg>
