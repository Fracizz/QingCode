<!-- QingCode Next 应用图标母版（扁平版）：纯色青底 + 单色白色 ">_" 终端提示符。
     512 画布、圆角 112；线条统一 46px 圆头圆角，字形整体居中并留足边距，16px 任务栏下仍清晰。
     与旧版 QingCode（深底）靠青色底区分。改动后运行 pnpm icons 重新生成各平台图标，
     并同步 apps/desktop/src/renderer/src/components/shell/Logo.tsx。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#13A68E"/>
  <g stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 168L242 256L150 344"/>
    <path d="M282 344H366"/>
  </g>
</svg>
