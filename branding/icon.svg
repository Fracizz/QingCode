<!-- QingCode Next 应用图标母版（扁平版）：近黑圆角底块 + 青色圆环 + 白色光标条。
     光标条压在圆环右下角充当 Q 的尾巴，同时表达命令行光标；圆环在光标条外 18 单位处直接裁出缺口，
     不靠底色遮挡，Android 单色主题图标可原样复用。全部纯色，无渐变、无高光。
     几何：圆环圆心 (240,256)，外半径 132、内半径 82（环宽 50）；缺口为 x≥250 且 y≥312 的矩形；光标条 x268 y330 136×48。
     图形外框 (108,124)-(404,388) 居中，宽度约占底块 58%，与常见应用图标的留白比例一致。
     颜色：底块 #0E0F11 比标题栏 #141414 略深，应用内仍能看出底块；青色 #4ECDB5 即主题 token --color-qn-brand。
     改动后运行 pnpm icons 重新生成各平台图标，并同步 Logo.tsx、index.html 进场页和 Android 自适应图标。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#0E0F11"/>
  <path fill="#4ECDB5" d="M250 387.62A132 132 0 1 1 359.53 312H299.9A82 82 0 1 0 250 337.39Z"/>
  <rect x="268" y="330" width="136" height="48" rx="10" fill="#FFFFFF"/>
</svg>
