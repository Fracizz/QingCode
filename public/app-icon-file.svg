<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- QingCode — 方案 C：深海纯翠单色系全息 Q 桌面打包母版（Apple Squircle 底板） -->
  <defs>
    <!-- 深邃黑曜石渐变底板 -->
    <radialGradient id="bg" cx="32%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#14181A"/>
      <stop offset="55%" stop-color="#0B0E10"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <linearGradient id="tide-upper" x1="120" y1="120" x2="380" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55E6CD"/>
      <stop offset="60%" stop-color="#2AC4A8"/>
      <stop offset="100%" stop-color="#1B8774"/>
    </linearGradient>
    <linearGradient id="tide-lower" x1="120" y1="280" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="50%" stop-color="#11998E"/>
      <stop offset="100%" stop-color="#085A52"/>
    </linearGradient>
    <linearGradient id="tide-tail" x1="270" y1="290" x2="440" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ECDB5"/>
      <stop offset="100%" stop-color="#147A6B"/>
    </linearGradient>
  </defs>

  <!-- 苹果官方 Squircle 连续曲率底板 (rx=115) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- 1. 上半环轨 (拱顶及右上弧) -->
  <path fill="url(#tide-upper)" d="M216 136 H324 C382 136 420 178 420 242 C420 274 404 304 378 324 L336 280 C352 268 360 256 360 242 C360 206 338 190 306 190 H262 L216 136 Z"/>

  <!-- 2. 下半环轨 (底托) -->
  <path fill="url(#tide-lower)" d="M216 376 H316 C340 376 362 366 378 350 L414 392 C388 418 354 432 312 432 H210 L252 376 Z"/>

  <!-- 3. Q 破风冲刺尾笔 -->
  <path fill="url(#tide-tail)" d="M272 292 L392 412 H448 L328 292 Z"/>

  <!-- 4. 核心代码尖括号 (石墨浅白) -->
  <path fill="#F3F6F8" d="M120 136 H208 L310 244 Q318 256 310 268 L208 376 H120 L234 256 Z"/>
</svg>
