<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 青墨黛石底板：提亮约 20%，消除死黑沉没感 -->
    <radialGradient id="bg" cx="35%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#22333B"/>
      <stop offset="55%" stop-color="#142026"/>
      <stop offset="100%" stop-color="#0D161B"/>
    </radialGradient>
    <!-- 边缘微光：界定 Squircle 轮廓边界 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <!-- 青轨长方形渐变 -->
    <linearGradient id="rail" x1="96" y1="352" x2="416" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7CE"/>
      <stop offset="0.5" stop-color="#4ECDB5"/>
      <stop offset="1" stop-color="#2FAF9B"/>
    </linearGradient>
  </defs>

  <!-- Squircle 圆角矩形底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- 单层平直圆角长方形底轨 (rx=10) -->
  <rect x="96" y="352" width="320" height="48" rx="10" fill="url(#rail)"/>

  <!-- 厚切代码尖括号 -->
  <path fill="#F3F6F8" d="M130 93H262Q264 93 267 95L385 194Q389 197 385 200L267 299Q264 301 262 301H130Q124 301 128 297L247 197L128 97Q124 93 130 93Z"/>
</svg>
