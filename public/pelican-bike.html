<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #123044;
      --cream: #fff8e8;
      --coral: #ff8f70;
      --sun: #ffd166;
      --water: #23788b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #092938;
      color: var(--cream);
    }

    .poster {
      width: min(100vw, 1180px);
      height: min(100vh, 760px);
      min-height: 540px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, #123e51 0%, #176b7b 52%, #e2836b 100%);
      isolation: isolate;
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 12%, rgba(255,255,255,.18), transparent 35%), linear-gradient(90deg, rgba(9,41,56,.12), transparent 28%, transparent 72%, rgba(9,41,56,.18));
      z-index: 4;
    }

    svg { width: 100%; height: 100%; display: block; }

    .title {
      position: absolute;
      z-index: 5;
      left: clamp(24px, 6vw, 76px);
      top: clamp(26px, 7vh, 62px);
      letter-spacing: .08em;
      user-select: none;
    }

    .title h1 { margin: 0; font-size: clamp(26px, 4vw, 48px); font-weight: 800; }
    .title p { margin: 8px 0 0; opacity: .78; font-size: clamp(12px, 1.4vw, 16px); letter-spacing: .18em; }

    .controls {
      position: absolute;
      z-index: 6;
      right: clamp(18px, 4vw, 52px);
      bottom: clamp(18px, 4vh, 36px);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(9,41,56,.35);
      backdrop-filter: blur(8px);
      font-size: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 7px 13px;
      color: var(--ink);
      background: var(--cream);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    input { accent-color: var(--sun); width: 86px; }

    .cloud { animation: drift 20s ease-in-out infinite alternate; }
    .cloud.slow { animation-duration: 30s; animation-delay: -7s; }
    .water-line { animation: water 3s linear infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
    .bike-rider { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .9s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: 90% 16%; animation: flap .9s ease-in-out infinite; }
    .leg-a { transform-box: fill-box; transform-origin: 12% 4%; animation: pedal-a .9s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 12% 4%; animation: pedal-b .9s linear infinite; }
    .feather { animation: feather 1.8s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes flap { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-10deg); } }
    @keyframes pedal-a { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pedal-b { from { transform: rotate(180deg); } to { transform: rotate(540deg); } }
    @keyframes drift { from { transform: translateX(-15px); } to { transform: translateX(40px); } }
    @keyframes water { from { transform: translateX(0); } to { transform: translateX(-70px); } }
    @keyframes feather { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    .paused * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="poster" aria-label="一只鹈鹕骑着自行车沿海边前进的 SVG 动画">
    <div class="title">
      <h1>海风骑手</h1>
      <p>THE PELICAN CYCLIST · SVG MOTION STUDY</p>
    </div>

    <svg viewBox="0 0 1180 760" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">鹈鹕骑自行车</title>
      <desc id="scene-desc">一只橙色脚蹼、白色羽毛的鹈鹕正在海边骑着红色自行车，车轮和双腿持续转动。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e6e80"/><stop offset="1" stop-color="#f49b77"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b9bad"/><stop offset="1" stop-color="#155d72"/></linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#d9e7df"/></linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb45d"/><stop offset="1" stop-color="#e76f51"/></linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".26"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="waves" width="150" height="42" patternUnits="userSpaceOnUse"><path d="M0 21 Q38 2 76 21 T152 21" fill="none" stroke="#a7e0d7" stroke-opacity=".18" stroke-width="3"/></pattern>
      </defs>

      <rect width="1180" height="760" fill="url(#sky)"/>
      <circle cx="936" cy="143" r="84" fill="#ffd166" opacity=".9"/>
      <circle cx="936" cy="143" r="112" fill="#ffd166" opacity=".16" filter="url(#soft)"/>

      <g class="cloud slow" fill="#f7e7d0" opacity=".38">
        <path d="M110 180c-20-32 26-63 61-42 13-50 89-42 96 11 40-18 76 22 54 52H125c-18 0-25-7-15-21Z"/>
      </g>
      <g class="cloud" fill="#fff4df" opacity=".3">
        <path d="M745 224c-16-27 21-52 49-35 11-42 73-35 79 9 32-15 61 18 43 43H758c-14 0-20-5-13-17Z"/>
      </g>

      <path d="M0 405 Q170 365 330 407 T660 402 T980 404 T1300 393 V760 H0Z" fill="url(#sea)"/>
      <rect y="405" width="1180" height="355" fill="url(#waves)"/>
      <path class="water-line" d="M-70 532 Q100 500 250 530 T570 527 T900 531 T1230 518" fill="none" stroke="#c2eee1" stroke-opacity=".45" stroke-width="4"/>
      <path class="water-line" d="M-40 620 Q150 594 300 620 T640 616 T950 620 T1260 605" fill="none" stroke="#8ed2cf" stroke-opacity=".4" stroke-width="3"/>
      <path d="M0 638 Q220 615 405 643 T800 636 T1180 646 V760 H0Z" fill="#123f55" opacity=".44"/>

      <!-- shadow under the bicycle -->
      <ellipse cx="598" cy="645" rx="254" ry="19" fill="#082b3d" opacity=".34" filter="url(#soft)"/>

      <g class="bike-rider" filter="url(#shadow)">
        <!-- bicycle frame -->
        <g stroke="#ff806b" stroke-width="9" stroke-linejoin="round" fill="none">
          <path d="M416 606 L535 606 L601 486 L478 486 Z"/>
          <path d="M535 606 L640 606 L601 486"/>
          <path d="M640 606 L666 471"/>
          <path d="M639 472 L697 454"/>
          <path d="M470 477 L436 462"/>
        </g>
        <g stroke="#f8d18c" stroke-width="5" fill="none"><path d="M582 477h39"/><path d="M649 459l25 11"/></g>
        <g fill="none" stroke="#d8f3e8" stroke-width="5">
          <circle class="wheel" cx="416" cy="606" r="72"/>
          <circle class="wheel" cx="640" cy="606" r="72"/>
        </g>
        <g fill="none" stroke="#d8f3e8" stroke-width="2" opacity=".72">
          <path d="M416 534v144M344 606h144M365 555l102 102M365 657l102-102"/>
          <path d="M640 534v144M568 606h144M589 555l102 102M589 657l102-102"/>
        </g>
        <circle cx="535" cy="606" r="16" fill="#ffd166" stroke="#123044" stroke-width="5"/>

        <!-- pelican body -->
        <path d="M510 287c-35-54-22-111 34-135 64-27 132 13 143 75 7 38-9 78-40 102-31 24-90 19-137-42Z" fill="url(#feather)" stroke="#123044" stroke-width="7"/>
        <path class="wing" d="M565 283c-28-58 4-119 56-119 37 0 58 39 38 74-18 30-55 48-94 45Z" fill="#c6ded6" stroke="#123044" stroke-width="7"/>
        <path d="M577 260c28-27 50-54 68-84M590 271c30-17 55-37 72-63" fill="none" stroke="#8ebbb4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
        <g class="feather" fill="#fffdf2"><circle cx="523" cy="221" r="7"/><circle cx="538" cy="206" r="6"/><circle cx="550" cy="190" r="5"/></g>

        <!-- head, crest, eye and long beak -->
        <path d="M523 170c-17-46 19-91 71-85 43 5 65 43 48 78-16 31-82 45-119 7Z" fill="url(#feather)" stroke="#123044" stroke-width="7"/>
        <path d="M548 96c-4-31 8-49 21-61 2 19 10 26 20 35 8-22 20-31 34-39-3 29-3 47-17 65Z" fill="#f4f0d7" stroke="#123044" stroke-width="6" stroke-linejoin="round"/>
        <path d="M622 141c51 3 94 19 119 40-40 26-83 27-124 9Z" fill="url(#beak)" stroke="#123044" stroke-width="7" stroke-linejoin="round"/>
        <path d="M635 160c31 4 62 12 82 22" fill="none" stroke="#b9504a" stroke-width="4" opacity=".7"/>
        <circle cx="591" cy="132" r="9" fill="#123044"/><circle cx="594" cy="129" r="3" fill="#fffdf2"/>

        <!-- legs on the pedals -->
        <g fill="none" stroke="#e76f51" stroke-width="12" stroke-linecap="round">
          <path class="leg-a" d="M565 365 L550 474 L535 606"/>
          <path class="leg-b" d="M612 364 L642 474 L535 606"/>
        </g>
        <path d="M529 608l-34 13M529 608l31 17M640 606l31 15" fill="none" stroke="#e76f51" stroke-width="8" stroke-linecap="round"/>
        <path d="M557 472c-16-4-28-2-41 4M641 473c15-4 28-1 40 5" fill="none" stroke="#123044" stroke-width="6" stroke-linecap="round"/>

        <!-- handlebar and scarf -->
        <path d="M548 196c-34 29-54 43-72 43" fill="none" stroke="#ff806b" stroke-width="8" stroke-linecap="round"/>
        <path d="M550 197c-28 3-44-6-58-20 3 29 18 48 43 57" fill="#ff806b" stroke="#123044" stroke-width="5"/>
        <path d="M556 186c-23 9-39 4-57-8" fill="none" stroke="#ffd166" stroke-width="7" stroke-linecap="round"/>
      </g>

      <g fill="#ffd166" opacity=".9">
        <circle cx="210" cy="315" r="4"/><circle cx="269" cy="278" r="3"/><circle cx="1040" cy="340" r="4"/><circle cx="1000" cy="285" r="2"/>
      </g>
    </svg>

    <div class="controls" aria-label="动画控制">
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
      <label for="speed">速度</label>
      <input id="speed" type="range" min="0.5" max="2" value="1" step="0.1" aria-label="动画速度" />
    </div>
  </main>
  <script>
    const poster = document.querySelector('.poster');
    const toggle = document.querySelector('#toggle');
    const speed = document.querySelector('#speed');
    poster.querySelectorAll('*').forEach((element) => {
      const seconds = parseFloat(getComputedStyle(element).animationDuration);
      if (Number.isFinite(seconds)) element.dataset.baseAnimationDuration = String(seconds);
    });
    toggle.addEventListener('click', () => {
      const paused = poster.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });
    speed.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      poster.style.setProperty('--motion-rate', value);
      poster.querySelectorAll('*').forEach((element) => {
        const base = Number(element.dataset.baseAnimationDuration);
        if (Number.isFinite(base)) element.style.animationDuration = `${base / value}s`;
      });
    });
  </script>
</body>
</html>
