[package]
name = "qingcode-agent"
version = "0.1.13-beta.3"
description = "QingCode SSH 工作区远端代理（部署在远程主机上，经 SSH direct-tcpip 通道接入）"
authors = ["Franciz"]
license = "MIT"
edition = "2021"

[lib]
name = "qingcode_agent"
path = "src/lib.rs"

[[bin]]
name = "qingcode-agent"
path = "src/main.rs"

# 依赖选择以「纯 Rust、无 C 依赖」为准，保证 x86_64/aarch64-unknown-linux-musl
# 用 rust-lld 静态链接即可产出可直接下发的二进制。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 协议负载是 MessagePack（设计 §5.1），字节字段用 serde_bytes 走 bin 类型，
# 避免 Vec<u8> 被编码成整数数组而膨胀数倍。
rmp-serde = "1"
serde_bytes = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "fs", "signal"] }
ignore = "0.4.29"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
# PTY 宿主（pty.rs）：portable-pty 在 Linux/macOS 走 openpty、Windows 走 ConPTY；
# vt100 提供无界面终端模拟器，用于断线后的屏幕快照。
portable-pty = "0.8"
vt100 = "0.15"
# self-check 子命令计算自身二进制的 sha256（安装完整性校验，设计 §4.2/§8.3）。
# 纯 Rust、无 C 依赖，musl 静态链接不受影响。
sha2 = "0.10"
# flock / setsid / SIGHUP 等只有 unix 需要，Windows 目标上不会被链接。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
